<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>
    <h2>Student Registration Form</h2>

    <form action="/register" method="POST">
        Name:
        <input type="text" name="name" required>
        <br><br>
        Year:
        <input type="text" name="year" required>
        <br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
